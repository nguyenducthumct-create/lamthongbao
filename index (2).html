<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<title>TẠO THÔNG BÁO</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--tx:#2b2118;--bd:#e2d6bf;--red:#b30000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1814;--card:#2a231d;--tx:#f1e8da;--bd:#4a3d31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Serif","Times New Roman",Times,serif;font-synthesis:style;text-rendering:optimizeLegibility}
.wrap{display:flex;flex-wrap:wrap;gap:20px;padding:16px;max-width:1100px;margin:auto}
.form{flex:1 1 320px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.form h1{font-size:20px;margin:0 0 12px;color:var(--red)}
label{display:block;font-size:13px;margin:10px 0 3px;font-weight:bold}
input,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
textarea{min-height:110px}
.row{display:flex;gap:8px}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sw{width:54px;height:80px;border:3px solid transparent;border-radius:6px;padding:0;background:#ccc center/cover no-repeat;cursor:pointer}
.sw.on{border-color:var(--red);box-shadow:0 0 0 2px #e5b73b}
select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
.up{display:inline-block;padding:8px 12px;border:1px dashed var(--red);border-radius:8px;font-size:13px;cursor:pointer;margin:0}
details{margin-top:12px;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
summary{cursor:pointer;font-weight:bold;font-size:14px}
.ad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;align-items:center;font-size:12px;margin-top:12px}
.ad input{padding:0;width:100%}
.ad b{grid-column:1/4;font-size:13px}.ad small{grid-column:1/4;display:grid;grid-template-columns:repeat(3,1fr);color:#8a6d1f;font-size:11px}
.tt{left:80px;width:864px;top:240px;height:150px;color:#b30000;font-weight:800;font-size:120px;text-transform:uppercase;display:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--red);color:#fff;font:inherit;font-weight:bold;cursor:pointer}
button.alt{background:#8a6d1f}
#msg{font-size:13px;margin-top:10px;min-height:18px}
.prev{flex:1 1 360px;display:flex;justify-content:center;align-items:flex-start}
.scale{width:100%;max-width:520px}
#poster{width:1024px;height:1536px;transform-origin:top left;position:relative;overflow:hidden;color:#14234f;text-align:center;background:#fbe9b8 0 0/100% 100% no-repeat;font-family:"Noto Serif","Times New Roman",Times,serif;font-synthesis:none;text-rendering:optimizeLegibility}
#poster .abs{position:absolute;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.15;white-space:nowrap}
.dang{left:290px;width:450px;top:40px;height:90px;color:#a80000;font-weight:bold;font-size:36px;text-transform:uppercase;white-space:normal!important;text-align:center}
.chibo{left:385px;width:265px;top:178px;height:66px;color:#fff3c4;font-weight:bold;font-size:60px;text-transform:uppercase}
.sub{left:275px;width:490px;top:405px;height:80px;color:#fff;font-weight:bold;font-size:76px;text-transform:uppercase}
.time{left:235px;width:670px;top:572px;height:82px;font-weight:bold;font-size:84px;flex-direction:row!important;gap:18px}
.time em{font-style:normal;color:#b30000}
.place{left:215px;width:735px;top:732px;height:92px;font-weight:bold;font-size:40px;white-space:normal!important}
.nd{left:100px;width:840px;top:928px;height:332px}
.nd ol{width:100%;list-style:none;margin:0;padding:0;height:100%;display:flex;flex-direction:column;text-align:left;counter-reset:n}
.nd li{counter-increment:n;flex:1;display:flex;align-items:center;gap:26px;font-weight:bold;white-space:nowrap;overflow:hidden;border-bottom:2px solid #eab560}
.nd li:last-child{border:0}
.nd li span{display:block;white-space:nowrap}
.nd li:before{content:counter(n);box-sizing:border-box;flex:none;width:var(--c,62px);height:var(--c,62px);border-radius:50%;background:radial-gradient(#d41414,#8a0000);color:#fff;text-align:center;line-height:calc(var(--c,62px) - 6px);font-size:calc(var(--c,62px)*.6);border:3px solid #e5b73b}
.call{left:235px;width:560px;top:1284px;height:94px;color:#c00;font-style:italic;font-weight:bold;font-size:34px;white-space:normal!important;line-height:1.25;text-wrap:balance}
input,textarea,select{font-size:16px}
button{min-height:44px}
.ad input[type=range]{height:28px}
.bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
.bar button{flex:1;min-height:48px;font-size:15px;background:#8a6d1f}
.bar button.on{background:var(--red)}
@media (max-width:799px){
 .wrap{padding:10px 10px 90px;gap:12px}
 .form,.prev{flex:1 1 100%}
 .bar{display:flex}
 body.tab-prev .form{display:none}
 body:not(.tab-prev) .prev{display:none}
 .scale{max-width:none}
 .form h1{font-size:18px}
 .btns button{flex:1 1 40%}
}
@media print{.bar{display:none!important}.prev{display:flex!important}}
.prev{min-width:0}
.scale{min-width:0;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
 <div class="form">
  <h1>TẠO THÔNG BÁO</h1>
  <label>Kiểu chữ</label><select id="font"></select>
  <label>Phông nền</label><div class="opt" id="bgs"></div>
  <label class="up">⬆ Tải nền của bạn lên<input type="file" id="bgfile" accept="image/*" hidden></label>
  <label>Đảng bộ</label><input id="dang" spellcheck="true" lang="vi" value="Đảng bộ trường THCS & THPT Mỹ Hương">
  <label>Tên chi bộ</label><input id="chibo" spellcheck="true" lang="vi" value="Chi bộ 1">
  <label>Tiêu đề lớn (chỉ hiện khi dùng nền tải lên)</label><input id="tt" spellcheck="true" lang="vi" value="Thông báo">
  <div class="row"><div style="flex:1"><label>Dòng trên ruy băng</label><input id="sub" spellcheck="true" lang="vi" value="Họp chi bộ"></div></div>
  <div class="row"><div style="flex:1"><label>Giờ</label><input id="gio" value="14:00"></div>
  <div style="flex:1"><label>Ngày</label><input id="ngay" value="06/11/2026"></div></div>
  <label>Địa điểm</label><input id="dd" spellcheck="true" lang="vi" value="Trường chính - ấp Xóm Lớn, xã Mỹ Hương, TP. Cần Thơ">
  <label>Nội dung (mỗi dòng một mục)</label>
  <textarea id="nd" spellcheck="true" lang="vi">Họp chi bộ thường kỳ tháng 11
Thông qua quyết định thành lập chi bộ
Tự phê bình và phê bình
Chuyên đề quý 4
Cập nhật sổ tay đảng viên 100%</textarea>
  <label>Lời kêu gọi</label>
  <input id="call" spellcheck="true" lang="vi" value="Đề nghị toàn thể đảng viên chi bộ sắp xếp thời gian tham dự đầy đủ, đúng giờ!">
  <details><summary>Chỉnh cỡ chữ &amp; vị trí</summary>
   <label style="font-weight:normal"><input type="checkbox" id="auto" checked style="width:auto"> Tự co chữ cho vừa khung</label>
   <div id="adj"></div><div class="btns"><button class="alt" id="rst" type="button">Đặt lại vị trí</button></div>
  </details>
  <div class="btns">
   <button class="alt" id="fix">✔ Sửa lỗi chính tả</button>
   <button id="png">Tải ảnh PNG</button>
   <button class="alt" id="prn">In</button>
  </div>
  <div id="msg"></div>
 </div>
 <div class="prev"><div class="scale" id="scale">
  <div id="poster">
   <div class="abs tt" id="p_tt"></div>
   <div class="abs dang" id="p_dang"></div>
   <div class="abs chibo" id="p_chibo"></div>
   <div class="abs sub" id="p_sub"></div>
   <div class="abs time" id="p_time"><span id="p_gio"></span><span>-</span><em id="p_ngay"></em></div>
   <div class="abs place" id="p_dd"></div>
   <div class="abs nd" id="b_nd"><ol id="p_nd"></ol></div>
   <div class="abs call" id="p_call"></div>
  </div>
 </div></div>
</div>
<div class="bar"><button id="tIn" type="button" class="on">✏ Nhập</button><button id="tPv" type="button">👁 Xem</button><button id="tDl" type="button" style="background:#b30000">⬇ Tải ảnh</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var ids=['dang','chibo','tt','sub','gio','ngay','dd','call'];
var BLK=[['tt','Tiêu đề lớn','p_tt'],['dang','Đảng bộ','p_dang'],['chibo','Tên chi bộ','p_chibo'],['sub','Ruy băng','p_sub'],['time','Giờ - ngày','p_time'],['dd','Địa điểm','p_dd'],['nd','Nội dung','b_nd'],['call','Lời kêu gọi','p_call']];
var cfg={};BLK.forEach(function(b){cfg[b[0]]={s:100,x:0,y:0}});
var custom=false;
function SC(k){return cfg[k].s/100}
function over(el){return el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1}
function fitEl(el,sc){el.style.fontSize='';var base=parseFloat(getComputedStyle(el).fontSize)*(sc||1);var au=$('auto').checked;
  var fs=au?base*1.3:base;el.style.fontSize=fs+'px';
  if(au){while(over(el)&&fs>10){fs-=1;el.style.fontSize=fs+'px'}}}
function unb(s){return s.replace(/^\s*(?:[-–—•·▪●*+]+\s*|\d{1,2}[.)]\s+)/,'')}
function render(){
  if(!$('poster').offsetWidth)return;
  ids.forEach(function(k){$('p_'+k).textContent=$(k).value.normalize('NFC')});
  BLK.forEach(function(b){var e=$(b[2]);e.style.marginLeft=cfg[b[0]].x+'px';e.style.marginTop=cfg[b[0]].y+'px'});
  var ol=$('p_nd');ol.innerHTML='';
  var L=$('nd').value.split('\n').map(unb).filter(function(x){return x.trim()});
  L.forEach(function(x){var li=document.createElement('li');var sp=document.createElement('span');sp.textContent=x.trim().normalize('NFC');li.appendChild(sp);ol.appendChild(li)});
  var fs=48*SC('nd');
  var lis=[].slice.call(ol.querySelectorAll('li')),best=1e9,au=$('auto').checked;
  lis.forEach(function(li){var sp=li.firstChild,c=Math.max(18,Math.min(62,Math.floor(li.clientHeight-6)));li.style.setProperty('--c',c+'px');var max=li.clientWidth-c-26,f=au?fs*1.15:fs;
    if(au)f=Math.min(f,li.clientHeight*0.7);li.style.fontSize=f+'px';
    if(au){while(sp.scrollWidth>max&&f>10){f-=1;li.style.fontSize=f+'px'}}
    best=Math.min(best,f)});
  lis.forEach(function(li){li.style.fontSize=best+'px'});
  [['p_dang','dang'],['p_chibo','chibo'],['p_sub','sub'],['p_dd','dd'],['p_call','call'],['p_tt','tt'],['p_time','time']].forEach(function(p){fitEl($(p[0]),SC(p[1]))});
}
function fit(){
  var s=$('scale'),w=s.clientWidth;if(w<50)return;var k=Math.min(1,w/1024);
  $('poster').style.transform='scale('+k+')';s.style.height=(1536*k)+'px';
}
// Từ điển lỗi thường gặp (không dấu / sai dấu -> đúng)
var DICT=[
 ['thong bao','thông báo'],['hop chi bo','họp chi bộ'],['chi bo','chi bộ'],['dang bo','đảng bộ'],['dang vien','đảng viên'],
 ['noi dung','nội dung'],['thoi gian','thời gian'],['dia diem','địa điểm'],['thuong ky','thường kỳ'],['thường kì','thường kỳ'],
 ['thuờng','thường'],['chuyen de','chuyên đề'],['tu phe binh va phe binh','tự phê bình và phê bình'],['phe binh','phê bình'],
 ['so tay','sổ tay'],['cap nhat','cập nhật'],['thanh lap','thành lập'],['quyet dinh','quyết định'],['thong qua','thông qua'],
 ['tham du','tham dự'],['day du','đầy đủ'],['dung gio','đúng giờ'],['de nghi','đề nghị'],['toan the','toàn thể'],
 ['sap xep','sắp xếp'],['truong chinh','trường chính'],['xa ','xã '],['Can Tho','Cần Thơ'],['My Huong','Mỹ Hương'],
 ['Xom Lon','Xóm Lớn'],['tieu de','tiêu đề'],['quy 4','quý 4'],['sinh hoat','sinh hoạt'],['nghi quyet','nghị quyết'],
 ['hoà','hòa'],['thuỷ','thủy'],['qủy','quỹ'],['quí','quý'],['tháng ','tháng ']
];
var ACR=[[/\bthcs\b/gi,'THCS'],[/\bthpt\b/gi,'THPT'],[/\btp\.?\s*(?=[A-ZÀ-Ỹa-zà-ỹ])/g,'TP. '],[/\bubnd\b/gi,'UBND'],[/\bcb-?gv-?nv\b/gi,'CB-GV-NV']];
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function fixText(t,cap){
  var o=t;t=t.normalize('NFC');
  t=t.replace(/[ \t]+/g,' ').trim();
  t=t.replace(/\s+([,.;:!?])/g,'$1').replace(/([,;:!?])(?=[^\s\d])/g,'$1 ').replace(/\.(?=[A-ZÀ-Ỹa-zà-ỹ])/g,'. ');
  t=t.replace(/([,.;:!?])\1+/g,'$1').replace(/\s+-\s+/g,' - ');
  DICT.forEach(function(p){t=t.replace(new RegExp(esc(p[0]),'gi'),function(m){
    var r=p[1];return m[0]!==m[0].toLowerCase()?r[0].toUpperCase()+r.slice(1):r;})});
  ACR.forEach(function(a){t=t.replace(a[0],a[1])});
  t=t.replace(/(^|[.!?]\s)([a-zà-ỹ])/g,function(m,a,b){return a+b.toUpperCase()});
  if(cap&&t)t=t.charAt(0).toUpperCase()+t.slice(1);
  return t;
}
$('fix').onclick=function(){
  var n=0;
  ['dang','chibo','sub','dd','call'].forEach(function(k){var v=fixText($(k).value,true);if(v!==$(k).value)n++;$(k).value=v});
  var lines=$('nd').value.split('\n').map(function(l){return fixText(unb(l),true)}).filter(Boolean);
  var nv=lines.join('\n');if(nv!==$('nd').value)n++;$('nd').value=nv;
  var d=$('ngay').value.trim().replace(/[.\-\s]+/g,'/');$('ngay').value=d;
  var g=$('gio').value.trim().replace(/h/i,':').replace(/\.|\s/g,':');if(/^\d{1,2}:?$/.test(g))g=g.replace(':','')+':00';$('gio').value=g;
  render();
  $('msg').textContent=n?('Đã chỉnh '+n+' mục. Bạn đọc lại lần nữa nhé, vì công cụ chỉ sửa được các lỗi phổ biến.'):'Không thấy lỗi phổ biến nào. Các từ gạch đỏ do trình duyệt gợi ý vẫn nên xem lại.';
};
function showImg(u){
  var o=$('ovl');
  if(!o){o=document.createElement('div');o.id='ovl';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px';
    o.innerHTML='<div style="color:#fff;font:14px sans-serif;text-align:center">Bấm giữ (điện thoại) hoặc chuột phải (máy tính) vào ảnh để lưu</div><img id="ovi" style="max-width:92vw;max-height:76vh;border-radius:6px"><div style="display:flex;gap:10px"><a id="ova" download="thong-bao.png" style="background:#b30000;color:#fff;padding:10px 16px;border-radius:8px;font:bold 14px sans-serif;text-decoration:none">Tải xuống</a><button id="ovc" type="button" style="background:#888">Đóng</button></div>';
    document.body.appendChild(o);$('ovc').onclick=function(){o.style.display='none'}}
  $('ovi').src=u;$('ova').href=u;o.style.display='flex';
}
$('png').onclick=function(){
  var p=$('poster'),old=p.style.transform;
  $('msg').textContent='Đang tạo ảnh...';
  function go(){
    p.style.transform='none';
    html2canvas(p,{scale:1,backgroundColor:null,useCORS:true,width:1024,height:1536}).then(function(c){
      p.style.transform=old;
      c.toBlob(function(bl){
        var u=URL.createObjectURL(bl);
        var a=document.createElement('a');a.download='thong-bao.png';a.href=u;document.body.appendChild(a);a.click();a.remove();
        showImg(u);
        $('msg').textContent='Đã tạo ảnh. Nếu máy chưa tự lưu, hãy lưu từ ảnh vừa hiện ra.';
      },'image/png');
    }).catch(function(e){p.style.transform=old;$('msg').textContent='Không tạo được ảnh ('+((e&&e.message)||'lỗi')+'). Hãy dùng nút In rồi lưu PDF.'});
  }
  if(window.html2canvas)go();else{var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=go;s.onerror=function(){$('msg').textContent='Không tải được thư viện tạo ảnh. Kiểm tra mạng hoặc dùng nút In.'};document.head.appendChild(s)}
};
function tab(t){document.body.classList.toggle('tab-prev',t==='pv');
  $('tIn').classList.toggle('on',t!=='pv');$('tPv').classList.toggle('on',t==='pv');
  if(t==='pv'){fit();render();window.scrollTo(0,0)}}
$('tIn').onclick=function(){tab('in')};
$('tPv').onclick=function(){tab('pv')};
$('tDl').onclick=function(){tab('pv');setTimeout(function(){$('png').click()},300)};
$('prn').onclick=function(){window.print()};
document.querySelectorAll('input,textarea').forEach(function(e){e.addEventListener('input',render)});
window.addEventListener('resize',fit);
fit();render();window.addEventListener('load',render);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
var st=document.createElement('style');
st.textContent='@media print{.form,.wrap>.form{display:none}.wrap{padding:0}.scale{max-width:none}}';document.head.appendChild(st);

$('adj').addEventListener('input',function(e){var t=e.target;cfg[t.dataset.k][t.dataset.p]=+t.value;render()});
$('auto').onchange=render;
$('rst').onclick=function(){BLK.forEach(function(b){cfg[b[0]]={s:100,x:0,y:0}});[].forEach.call($('adj').querySelectorAll('input'),function(i){i.value=i.dataset.p==='s'?100:0});render()};
Object.keys(FONTS).forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;o.style.fontFamily=n;$('font').appendChild(o)});
BG.forEach(function(x,i){var s=document.createElement('button');s.type='button';s.className='sw';s.title=x.n;s.style.backgroundImage='url('+x.d+')';s.onclick=function(){setBg(i)};$('bgs').appendChild(s)});
$('font').onchange=function(){setFont(this.value)};
setBg(0);
</script>
